spring.config.import=optional:file:../../.env[.properties]

spring.application.name=api

server.port=8081

spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/app
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/main

logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.mvc.problemdetails.enabled=true

aws.s3.endpoint=http://localhost:4566
aws.s3.region=eu-central-2
aws.s3.bucket.name=hruych-bucket
aws.s3.credentials.access-key=${AWS_S3_ACCESS_KEY}
aws.s3.credentials.secret-key=${AWS_S3_SECRET_KEY}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.web.socket.server=DEBUG
logging.level.org.springframework.messaging=DEBUG
logging.level.org.springframework.web.socket.messaging=DEBUG

logging.level.org.springframework.security=DEBUG